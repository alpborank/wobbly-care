<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wobbly — Email Verified</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(
135deg,
#7c3aed,
#ec4899
);

min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:450px;
}

.card{
background:#ffffff;
border-radius:28px;
padding:40px 30px;
text-align:center;

box-shadow:
0 10px 40px rgba(0,0,0,.12);
}

.logo{
font-size:32px;
font-weight:700;
margin-bottom:10px;
color:#7c3aed;
}

.icon{
font-size:64px;
margin-bottom:20px;
}

.title{
font-size:28px;
font-weight:700;
color:#222;
margin-bottom:12px;
line-height:1.3;
}

.text{
font-size:16px;
color:#666;
line-height:1.6;
margin-bottom:10px;
word-break:break-word;
}

.button{
display:inline-block;
margin-top:25px;

background:linear-gradient(
90deg,
#7c3aed,
#ec4899
);

color:white;
text-decoration:none;

padding:14px 30px;

border-radius:999px;
font-weight:600;

min-width:180px;
}

.footer{
margin-top:25px;
font-size:13px;
color:#999;
}

@media screen and (max-width:480px){

.card{
padding:30px 20px;
border-radius:22px;
}

.title{
font-size:24px;
}

.text{
font-size:15px;
}

.icon{
font-size:54px;
}

.button{
width:100%;
}
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
Wobbly
</div>

<div class="icon">
🎉
</div>

<h1 class="title">
Email Verified Successfully
</h1>

<p class="text">
Your account has been verified successfully.
</p>

<p class="text">
You can now return to the app and start connecting with people.
</p>

<p class="button">
You can go Back Wobbly
</p>

<div class="footer">
© 2026 Wobbly
</div>

</div>

</div>

</body>
</html>
