
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wobbly — Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #dbe3eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #2DD4BF;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #E6FAF8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 6px;
    }

    .input-row {
      position: relative;
    }

    .input-row input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      font-size: 15px;
      color: #1F2937;
      background: #ffffff;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #2DD4BF;
    }

    .toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      color: #9CA3AF;
    }

    /* Strength bar */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-bar span {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: #E5E7EB;
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 4px;
      text-align: right;
      min-height: 15px;
    }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background-color: #2DD4BF;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #1aaa97; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: left;
      display: none;
    }
    .msg.error   { background: #FFF0F0; color: #dc2626; border: 1px solid #fecaca; }
    .msg.success { background: #E6FAF8; color: #1aaa97; border: 1px solid #2DD4BF44; }

    #success-view { display: none; }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #9CA3AF;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 22px; }
      .title { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">wobbly</div>

  <!-- FORM -->
  <div id="form-view">
    <div class="icon-circle">🔑</div>
    <h1 class="title">New Password</h1>
    <p class="subtitle">Choose a strong password for your account.</p>

    <div class="input-group">
      <label for="password">New Password</label>
      <div class="input-row">
        <input type="password" id="password" placeholder="At least 6 characters" oninput="checkStrength()" />
        <span class="toggle" onclick="toggle('password', this)">👁</span>
      </div>
      <div class="strength-bar">
        <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
      </div>
      <div class="strength-label" id="strength-label"></div>
    </div>

    <div class="input-group">
      <label for="confirm">Confirm Password</label>
      <div class="input-row">
        <input type="password" id="confirm" placeholder="Repeat your password" />
        <span class="toggle" onclick="toggle('confirm', this)">👁</span>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <button class="btn" id="submit-btn" onclick="updatePassword()">Update Password</button>
  </div>

  <!-- SUCCESS -->
  <div id="success-view">
    <div class="icon-circle">✅</div>
    <h1 class="title">Password Updated</h1>
    <p class="subtitle">Your password has been changed successfully. You can now log in to Wobbly.</p>
  </div>

  <div class="footer">© 2026 Wobbly</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL  = 'https://epzgbrmlkjdqzfutskyr.supabase.co/rest/v1/'
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwemdicm1sa2pkcXpmdXRza3lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzAyMDgsImV4cCI6MjA5MjYwNjIwOH0.Lvzr78kN3XFv_dstfckIv5x2YPBmn52Sz2DAeN1bGII'

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

  // Hash'ten token'ları al
  const hash = window.location.hash.substring(1)
  const params = new URLSearchParams(hash)
  const accessToken  = params.get('access_token')
  const refreshToken = params.get('refresh_token')

  if (accessToken) {
    // Session'ı manuel set et
    sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
      .then(({ error }) => {
        if (error) showMsg('Invalid or expired link.', 'error')
      })
  } else {
    // Token yoksa hata göster
    document.getElementById('form-view').style.display = 'none'
    document.getElementById('success-view').innerHTML = `
      <div class="icon-circle">❌</div>
      <h1 class="title">Link Expired</h1>
      <p class="subtitle">This reset link is invalid or has expired. Please request a new one.</p>
    `
    document.getElementById('success-view').style.display = 'block'
  }

  function toggle(id, el) {
    const input = document.getElementById(id)
    input.type = input.type === 'password' ? 'text' : 'password'
    el.textContent = input.type === 'password' ? '👁' : '🙈'
  }

  function checkStrength() {
    const val = document.getElementById('password').value
    const bars = ['s1','s2','s3','s4'].map(id => document.getElementById(id))
    const label = document.getElementById('strength-label')
    bars.forEach(b => b.style.background = '#E5E7EB')
    let score = 0
    if (val.length >= 8) score++
    if (/[A-Z]/.test(val)) score++
    if (/[0-9]/.test(val)) score++
    if (/[^A-Za-z0-9]/.test(val)) score++
    const colors = ['#FF6B6B','#F4A261','#6EE7B7','#2DD4BF']
    const labels = ['Weak','Fair','Good','Strong']
    for (let i = 0; i < score; i++) bars[i].style.background = colors[score - 1]
    label.textContent = score > 0 ? labels[score - 1] : ''
    label.style.color = score > 0 ? colors[score - 1] : '#9CA3AF'
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg')
    el.textContent = text
    el.className = 'msg ' + type
    el.style.display = 'block'
  }

  async function updatePassword() {
    const pw  = document.getElementById('password').value
    const con = document.getElementById('confirm').value
    const btn = document.getElementById('submit-btn')

    if (pw.length < 8) return showMsg('Password must be at least 8 characters.', 'error')
    if (pw !== con)    return showMsg('Passwords do not match.', 'error')

    btn.disabled = true
    btn.textContent = 'Updating...'

    const { error } = await sb.auth.updateUser({ password: pw })

    if (error) {
      showMsg(error.message, 'error')
      btn.disabled = false
      btn.textContent = 'Update Password'
    } else {
      document.getElementById('form-view').style.display = 'none'
      document.getElementById('success-view').style.display = 'block'
    }
  }
</script>

</body>
</html>
