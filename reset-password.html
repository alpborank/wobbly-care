
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wobbly — Reset Password</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#dbe3eb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:#fff;
border-radius:24px;
padding:44px 36px;
width:100%;
max-width:420px;
box-shadow:0 4px 24px rgba(0,0,0,.08);
text-align:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#2DD4BF;
margin-bottom:28px;
}

.icon-circle{
width:64px;
height:64px;
border-radius:50%;
background:#E6FAF8;
display:flex;
justify-content:center;
align-items:center;
margin:0 auto 20px;
font-size:28px;
}

.title{
font-size:22px;
font-weight:700;
color:#1F2937;
margin-bottom:8px;
}

.subtitle{
font-size:14px;
line-height:1.6;
color:#6B7280;
margin-bottom:32px;
}

.input-group{
text-align:left;
margin-bottom:16px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:13px;
font-weight:600;
}

.input-row{
position:relative;
}

.input-row input{
width:100%;
padding:13px 44px 13px 16px;
border:1.5px solid #E5E7EB;
border-radius:12px;
outline:none;
font-size:15px;
}

.input-row input:focus{
border-color:#2DD4BF;
}

.toggle{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
user-select:none;
font-size:16px;
}

.strength-bar{
display:flex;
gap:4px;
margin-top:8px;
}

.strength-bar span{
flex:1;
height:3px;
border-radius:99px;
background:#E5E7EB;
}

.strength-label{
font-size:11px;
text-align:right;
margin-top:4px;
color:#9CA3AF;
min-height:15px;
}

.btn{
width:100%;
padding:14px;
margin-top:24px;
background:#2DD4BF;
border:none;
border-radius:12px;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
display:none;
font-size:13px;
text-align:left;
}

.msg.error{
background:#FFF0F0;
border:1px solid #fecaca;
color:#dc2626;
}

.msg.success{
background:#E6FAF8;
border:1px solid #2DD4BF44;
color:#1aaa97;
}

#success-view{
display:none;
}

.footer{
margin-top:28px;
font-size:12px;
color:#9CA3AF;
}

@media(max-width:480px){

.card{
padding:32px 22px;
}

.title{
font-size:20px;
}

}
</style>

</head>

<body>

<div class="card">

<div class="logo">
wobbly
</div>

<div id="form-view">

<div class="icon-circle">
🔑
</div>

<h1 class="title">
New Password
</h1>

<p class="subtitle">
Choose a strong password for your account.
</p>

<div class="input-group">

<label for="password">
New Password
</label>

<div class="input-row">

<input
type="password"
id="password"
placeholder="At least 8 characters"
/>

<span
class="toggle"
id="togglePassword"
>
👁
</span>

</div>

<div class="strength-bar">
<span id="s1"></span>
<span id="s2"></span>
<span id="s3"></span>
<span id="s4"></span>
</div>

<div
class="strength-label"
id="strength-label"
></div>

</div>

<div class="input-group">

<label for="confirm">
Confirm Password
</label>

<div class="input-row">

<input
type="password"
id="confirm"
placeholder="Repeat password"
/>

<span
class="toggle"
id="toggleConfirm"
>
👁
</span>

</div>

</div>

<div
class="msg"
id="msg"
></div>

<button
class="btn"
id="submit-btn"
>
Update Password
</button>

</div>

<div id="success-view">

<div class="icon-circle">
✅
</div>

<h1 class="title">
Password Updated
</h1>

<p class="subtitle">
Your password has been updated successfully.
</p>

</div>

<div class="footer">
© 2026 Wobbly
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./reset-password.js"></script>

</body>
</html>
